version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: bogota-postgres
    environment:
      POSTGRES_USER: bogota
      POSTGRES_PASSWORD: bogota_dev_2026
      POSTGRES_DB: bogota_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bogota -d bogota_insights"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bogota-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: