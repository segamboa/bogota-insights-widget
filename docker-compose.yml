version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bogota-insights-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bogota_insights
      POSTGRES_USER: bogota
      POSTGRES_PASSWORD: bogota_dev_2026
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bogota -d bogota_insights']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bogota-insights-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
