name: CI

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop, 'feature/*']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        # version auto-detected from package.json#packageManager (pnpm@8.15.0)

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint step disabled — eslint is not installed in any workspace package.
      # TODO: Set up eslint with @typescript-eslint and re-enable.
      # - name: Lint
      #   run: pnpm lint

      # Type checking is already covered by the Build step (tsc in each package)

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check bundle size
        run: |
          cd packages/widget/dist
          SIZE=$(gzip -c bogota-insights.es.js | wc -c)
          if [ $SIZE -gt 51200 ]; then
            echo "❌ Widget bundle exceeds 50KB gzipped ($SIZE bytes)"
            exit 1
          fi
          echo "✅ Widget bundle size: $SIZE bytes (gzipped)"
