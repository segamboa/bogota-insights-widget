# Local development stack — levanta todo el proyecto con un solo comando
# Uso: docker-compose -f docker-compose.local.yml up --build
#
# Servicios:
#   - PostgreSQL 16 + PostGIS (datos persistentes en volumen)
#   - Redis 7 (caché)
#   - API (construida desde packages/api/Dockerfile)
#
# Nota: El widget se desarrolla en el host con `pnpm dev` para hot reload.

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bogota-insights-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: bogota_insights
      POSTGRES_USER: bogota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bogota_dev_2026}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bogota -d bogota_insights']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bogota-insights-redis-local
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata_local:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: bogota-insights-api-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://bogota:${POSTGRES_PASSWORD:-bogota_dev_2026}@postgres:5432/bogota_insights
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 10
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ''
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_WINDOW: 60000
      CORS_ORIGIN: '*'
    env_file:
      - ./packages/api/.env.local

volumes:
  pgdata_local:
  redisdata_local:
